name: Daily ingest

# JPX の日次ファイル(建玉・清算値段)を取得・解析して Worker に送る。
# Workers の CPU 制限内では 4MB の CSV を解析できないため、解析はここで行う。
# 取得済みの日は Worker 側で上書き(冪等)、X 投稿は 1 日 1 回のみ。
# JPX の日次ファイルは夕方以降に順次公表されるため、未公表なら何度か再試行する。
# JPX 未公表でも一目均衡表は Yahoo Finance の最新足で先に更新する(/admin/ingest-ichimoku)。
on:
  schedule:
    - cron: "15 8 * * 1-5"  # 17:15 JST(一目: Yahoo の当日足で先行更新。JPX は未公表のことが多い)
    - cron: "30 9 * * 1-5"  # 18:30 JST
    - cron: "0 11 * * 1-5"  # 20:00 JST(公表遅れ時の再試行)
    - cron: "30 12 * * 1-5" # 21:30 JST(再試行)
    - cron: "30 14 * * 1-5" # 23:30 JST(最終再試行)
  workflow_dispatch:

concurrency: daily

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch, parse and send
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
        run: |
          export SITE_URL="${SITE_URL_VAR:-$(grep -Eo 'SITE_URL = "[^"]+"' wrangler.toml | cut -d'"' -f2)}"
          npx tsx scripts/daily-fetch.mts
