name: Daily ingest

# JPX の日次ファイル(建玉・清算値段)を取得・解析して Worker に送る。
# Workers の CPU 制限内では 4MB の CSV を解析できないため、解析はここで行う。
# 取得済みの日は Worker 側で上書き(冪等)、X 投稿は 1 日 1 回のみ。
#
# スケジュール実行は「待機ループ」(scripts/wait-and-fetch.mts):
#   大引け(15:45)直後に起動し、JPX の一覧ページを 2 分ごとに確認して、当日分の 2 ファイルがそろった時点で取り込む。
#   起動直後に 1 回実行するので、一目均衡表は JPX の公表を待たずに更新される。
#   GitHub のスケジュールは遅延・欠落があるため起動時刻を複数用意(実行中なら後続は待機し、取り込み済みなら即終了)。
# 手動実行(workflow_dispatch)は既定で 1 回だけ取得する。
on:
  schedule:
    - cron: "50 6 * * 1-5"  # 15:50 JST(本命)
    - cron: "40 7 * * 1-5"  # 16:40 JST(予備)
    - cron: "40 8 * * 1-5"  # 17:40 JST(予備)
    - cron: "10 10 * * 1-5" # 19:10 JST(予備)
    - cron: "10 12 * * 1-5" # 21:10 JST(予備)
  workflow_dispatch:
    inputs:
      mode:
        description: "once = 1回だけ取得 / wait = 当日分の公表まで待って取得"
        default: once
        type: choice
        options: [once, wait]

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 500
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Fetch, parse and send
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          MODE: ${{ github.event_name == 'schedule' && 'wait' || inputs.mode || 'once' }}
        run: |
          export SITE_URL="${SITE_URL_VAR:-$(grep -Eo 'SITE_URL = "[^"]+"' wrangler.toml | cut -d'"' -f2)}"
          if [ "$MODE" = "wait" ]; then npx tsx scripts/wait-and-fetch.mts; else npx tsx scripts/daily-fetch.mts; fi
