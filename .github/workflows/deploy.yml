name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets"; exit 1
          fi

      # D1 が無ければ作成し、database_id を wrangler.toml に差し込む
      - name: Ensure D1 database
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="opt225");process.stdout.write(d?d.uuid:"")')
          if [ -z "$ID" ]; then
            npx wrangler d1 create opt225
            ID=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(l.find(x=>x.name==="opt225").uuid)')
          fi
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$ID/" wrangler.toml
          echo "D1: $ID"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply opt225 --remote

      # workers.dev サブドメイン未登録のアカウントなら登録する(既に登録済みなら何もしない)
      - name: Ensure workers.dev subdomain
        env:
          WANT: ${{ vars.WORKERS_SUBDOMAIN }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          CUR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | jq -r '.result.subdomain // empty')
          if [ -n "$CUR" ]; then echo "::notice title=workers.dev::$CUR.workers.dev"; exit 0; fi
          for NAME in ${WANT:-imlabo imlabo-opt225 opt225-$CLOUDFLARE_ACCOUNT_ID}; do
            R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d "{\"subdomain\":\"${NAME:0:63}\"}" "$API")
            if [ "$(echo "$R" | jq -r .success)" = "true" ]; then echo "::notice title=workers.dev registered::${NAME:0:63}.workers.dev"; exit 0; fi
            echo "::warning::subdomain $NAME failed: $(echo "$R" | jq -c .errors)"
          done
          exit 1

      - name: Deploy worker
        run: |
          ARGS=""
          if [ -n "${{ vars.SITE_URL }}" ]; then ARGS="$ARGS --var SITE_URL:${{ vars.SITE_URL }}"; fi
          if [ -n "${{ vars.X_POST_ENABLED }}" ]; then ARGS="$ARGS --var X_POST_ENABLED:${{ vars.X_POST_ENABLED }}"; fi
          set -o pipefail
          if ! npx wrangler deploy $ARGS 2>&1 | tee deploy.log; then
            # エラー内容を注釈として残す(ログを開かずに確認できるように)
            grep -v "^\s*$" deploy.log | tail -25 | sed 's/^/::error::/' ; exit 1
          fi
          grep -Eo "https://[a-z0-9.-]+\.workers\.dev" deploy.log | grep -v example | sort -u | sed 's/^/::notice title=Deployed::/' || true

      # GitHub Secrets に登録されているものだけ Worker の secret に同期
      - name: Sync worker secrets
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          node -e '
            const keys=["ADMIN_TOKEN","X_API_KEY","X_API_SECRET","X_ACCESS_TOKEN","X_ACCESS_SECRET"];
            const o={}; for (const k of keys) if (process.env[k]) o[k]=process.env[k];
            require("fs").writeFileSync("secrets.json", JSON.stringify(o));
            console.log("syncing:", Object.keys(o).join(", ") || "(none)");'
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json; fi
          rm -f secrets.json

      # 公開 URL の疎通確認と、取得パイプラインの実行(冪等: 取得済みの週はスキップ)
      - name: Smoke test & ingest
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          URL="${{ vars.SITE_URL }}"
          [ -z "$URL" ] && URL=$(grep -Eo 'SITE_URL = "[^"]+"' wrangler.toml | cut -d'"' -f2)
          for i in 1 2 3 4 5 6; do CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/"); [ "$CODE" = 200 ] && break; sleep 10; done
          echo "::notice title=GET /::$URL -> HTTP $CODE"
          if [ -n "$ADMIN_TOKEN" ]; then
            RES=$(curl -s -X POST -H "Authorization: Bearer $ADMIN_TOKEN" "$URL/admin/run")
            echo "::notice title=/admin/run::$(echo "$RES" | jq -c '{ingested, errors, analyzed, post: .post.status}')"
          fi
          echo "::notice title=/api/latest::$(curl -s "$URL/api/latest" | jq -c '{weekEnd, score, bias, volSignal}')"
