name = "opt225"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "opt225"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# JPX は投資部門別取引状況(週間)を原則 第4営業日(木曜)15:00 JST 頃に公表。
# 木・金の 16:30 JST(07:30 UTC) に取得→分析→X投稿。取得済みの週はスキップされる(冪等)。
[triggers]
# 平日 15:50 JST(06:50 UTC)と 18:00 JST(09:00 UTC): GitHub Actions の daily ワークフローを起動(GitHub のスケジュールは数時間遅れるため)
# 毎分(月〜土 UTC): 天井・大底候補アラート(先物の 5分/15分/60分足。進行中の足も速報として判定)
crons = ["30 7 * * 4,5", "50 6 * * 1-5", "0 9 * * 1-5", "* * * * 1-6"]

[vars]
SITE_URL = "https://opt225.imlabosns.workers.dev"
JPX_INDEX_URL = "https://www.jpx.co.jp/markets/statistics-derivatives/sector/index.html"
X_POST_ENABLED = "false"
ALERT_TO = "mecchatsuiteru@gmail.com"
# Secrets (wrangler secret put):
#   ADMIN_TOKEN, X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET, GH_DISPATCH_TOKEN, RESEND_API_KEY
